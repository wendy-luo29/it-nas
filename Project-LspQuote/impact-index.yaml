# 测试影响索引
# 机读 YAML，Skill 和脚本直接解析判断回归范围。
# 格式约定：每个 change 条目唯一 ID + 变更单元 + 回归目标用例清单。
#
# 维护规则：
# 1. 每次规则/API/DB 变更 → 新增 change 条目（不是覆盖旧的）
# 2. regression_targets 用 case_id（如 TC-ADDR-001），必须同时存在于
#    testcases/*.yaml 与 tests/**/*.py 的 `# case_id:`，禁止幽灵回归项
# 3. 确实没有自动化用例时，regression_targets 置空并填写 coverage_gap 说明缺口
# 4. 历史条目保留，标记 status: superseded 即可
# 5. Skill 在执行时读 changes[].regression_targets 来决定跑哪些用例
# 6. knowledge_docs 路径相对本项目目录（知识库根），代码仓内的文件按代码仓根回退解析
# 7. 新增/变更条目后运行 python tools/knowledge_guard.py --knowledge-root Project-LspQuote --strict 校验

changes:
  # ───────────────────────────────────────────────────────
  # CHG-001: 地址校验 v2.1 规则全面确认
  # 缺口：地址校验尚无自动化脚本，历史 TC-ADDR-* 编号为设计稿，
  #       未落脚本，已从回归目标移除。
  # ───────────────────────────────────────────────────────
  - id: CHG-001
    module: lsp_backend
    feature: address_validation
    field: country (default + validation)
    date: "2026-11-15"
    type: rule_change
    description: |
      country 字段接受 AU/Australia（大小写不敏感），
      默认值 Australia，非 AU 拒绝。
    affected_carriers: [all]
    regression_targets: []
    coverage_gap: "无自动化脚本：address_validation 尚未生成 tests/api 用例"
    gotchas: [gotcha_001, gotcha_002]
    knowledge_docs:
      - Common/业务规则/lsp_backend/address_validation.md
      - Common/变更记录/2026-11-15_address_v2_1.md
    status: active

  - id: CHG-001b
    module: lsp_backend
    feature: address_validation
    field: not_found_response
    date: "2026-11-15"
    type: rule_change
    description: |
      not-found 场景走 HTTP 200 + data.success=false，
      不是 HTTP 404。reason="address not found"。
    affected_carriers: [all]
    regression_targets: []
    coverage_gap: "无自动化脚本：address_validation 尚未生成 tests/api 用例"
    gotchas: [gotcha_002]
    knowledge_docs:
      - Common/业务规则/lsp_backend/address_validation.md
    status: active

  - id: CHG-001c
    module: lsp_backend
    feature: address_validation
    field: state_normalization + suburb_case_insensitive_query
    date: "2026-11-15"
    type: rule_change
    description: |
      state 全名自动标准化为缩写；
      DB 查询 suburb 大小写不敏感 (UPPER 包装)。
    affected_carriers: [all]
    regression_targets: []
    coverage_gap: "无自动化脚本：address_validation 尚未生成 tests/api 用例"
    knowledge_docs:
      - Common/业务规则/lsp_backend/address_validation.md
    status: active

  - id: CHG-001d
    module: lsp_backend
    feature: address_validation
    field: pobox_detection
    date: "2026-11-15"
    type: rule_change
    description: |
      PO Box 正则大小写不敏感，覆盖 PO Box / P.O.Box /
      Post Office Box / GPO / LPO 等变体。
    affected_carriers: [all]
    regression_targets: []
    coverage_gap: "无自动化脚本：address_validation 尚未生成 tests/api 用例"
    gotchas: [gotcha_001]
    knowledge_docs:
      - Common/业务规则/lsp_backend/address_validation.md
      - Common/踩坑记录/gotcha_001_pobox_case.md
    status: active

  # ───────────────────────────────────────────────────────
  # CHG-002: Carrier A v1.2 → v2.0 计费规则升级
  # 缺口：carrier_a 为配置层样例，未生成对应脚本。
  # ───────────────────────────────────────────────────────
  - id: CHG-002
    module: lsp_quote
    feature: pricing
    field: carrier_a.volumetric_weight_coefficient
    date: "2026-11-20"
    type: carrier_version
    from_version: v1.2
    to_version: v2.0
    description: |
      体积重公式变更：系数 5000 → 4000，
      体积重计算值更大，计费更高。
    affected_carriers: [carrier_a]
    regression_targets: []
    coverage_gap: "无自动化脚本：carrier_a 配置样例未生成 tests/api 用例"
    knowledge_docs:
      - Common/业务规则/lsp_quote/pricing_generic.md
      - Common/变更记录/2026-11-20_quote_carrier_a_v2.md
      - config/lsp_quote/carrier_a/v2.0.yaml
    status: active

  - id: CHG-002b
    module: lsp_quote
    feature: pricing
    field: carrier_a.remote_area_surcharge
    date: "2026-11-20"
    type: new_feature
    description: |
      v2.0 新增偏远地区附加费 flag，固定 $3.50/包裹。
    affected_carriers: [carrier_a]
    regression_targets: []
    coverage_gap: "无自动化脚本：carrier_a 配置样例未生成 tests/api 用例"
    knowledge_docs:
      - Common/变更记录/2026-11-20_quote_carrier_a_v2.md
    status: active

# ───────────────────────────────────────────────────────
# 模块-承运商-版本 三维索引（快速查找用）
# test_path 为空表示该功能暂无自动化脚本，需先在 tests/ 下落库再回填
# ───────────────────────────────────────────────────────
module_registry:
  lsp_backend:
    description: 基础信息配置（地址校验、策略配置）
    carriers: [all]                 # 承运商无关
    features:
      address_validation:
        current_version: v2.1
        config_path: config/lsp_backend/address_validation.yaml
        test_path: ""
        test_status: no_automation
      strategy_config:
        current_version: v1.0
        config_path: config/lsp_backend/strategy_config.yaml
        test_path: ""
        test_status: no_automation

  lsp_quote:
    description: 物流计费/报价
    carriers: [carrier_a, carrier_b]
    features:
      pricing:
        current_version: carrier_a=v2.0, carrier_b=v1.0
        config_path: config/lsp_quote/
        test_path: ""
        test_status: no_automation

  lsp_booking:
    description: 物流申报/下单
    carriers: [carrier_a, carrier_b]
    features:
      declare:
        current_version: v1.0
        config_path: config/lsp_booking/
        test_path: ""
        test_status: no_automation
